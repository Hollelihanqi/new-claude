name: point-cos-manifest

# Temporary operational fallback: publish the domestic stable manifest with
# GitHub download URLs when the cross-border COS asset upload is degraded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已公开的 GitHub 正式版 Tag（形如 v3.3.14）"
        required: true
        type: string

jobs:
  point:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      MIRROR_TAG: ${{ inputs.tag }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_PUBLIC_BASE_URL: ${{ secrets.TENCENT_COS_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装 COS 官方 SDK
        run: pip install -r scripts/cos-requirements.txt
      - name: 用 GitHub 下载地址更新国内正式版清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manifest"
          gh release download "$MIRROR_TAG" --pattern latest.json --dir "$RUNNER_TEMP/manifest"
          python scripts/point_stable_github.py "$MIRROR_TAG" "$RUNNER_TEMP/manifest/latest.json"
