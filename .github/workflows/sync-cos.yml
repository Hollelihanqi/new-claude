name: sync-cos

# Bootstrap / repair the mirror from already published, signed release assets.
# Never rebuild an existing version or modify the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "同步当前正式版（例如 v3.2.0；必须是 GitHub Latest）"
        required: true
        type: string

jobs:
  mirror:
    runs-on: ubuntu-latest
    concurrency:
      group: pathmux-cos-stable
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MIRROR_TAG: ${{ inputs.tag }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_PUBLIC_BASE_URL: ${{ secrets.TENCENT_COS_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 检查镜像发布逻辑
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: 安装 COS 官方 SDK
        run: pip install -r scripts/cos-requirements.txt
      - name: 校验并下载当前正式版
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/latest-release.json")); assert r["tag_name"]==os.environ["MIRROR_TAG"] and not r["draft"] and not r["prerelease"], "只能同步当前正式版"'
          gh release download "$MIRROR_TAG" --dir "$RUNNER_TEMP/cos-assets"
      - name: 同步并校验候选镜像
        run: python scripts/cos_mirror.py stage --tag "$MIRROR_TAG" --repo "$GH_REPO" --assets "$RUNNER_TEMP/cos-assets"
      - name: 最后更新国内正式版清单
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          python scripts/cos_mirror.py promote --tag "$MIRROR_TAG" --repo "$GH_REPO" --latest-release "$RUNNER_TEMP/latest-release.json"
